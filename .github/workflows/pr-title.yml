name: Lint PR title

# Squash merges use the PR title as the commit subject (repo setting:
# squash_merge_commit_title = COMMIT_OR_PR_TITLE), so enforcing Conventional
# Commits on the PR title keeps main's history conventional.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
